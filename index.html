<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Random Letter Filter</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .stage {
      position: relative;
      width: min(100vw, 450px);
      height: min(100dvh, 820px);
      border-radius: 20px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: pointer;
    }
    .rec-indicator {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      pointer-events: none;
    }
    .rec-indicator.active { display: flex; }
    .dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    .controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
    }
    .hint {
      color: #fff;
      font-size: 13px;
      background: rgba(0,0,0,0.45);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .btn-row {
      display: flex;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }
    .rec-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 6px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
    }
    .rec-btn:active { transform: scale(0.92); }
    .rec-inner {
      width: 100%;
      height: 100%;
      background: #ff2b4e;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .rec-btn.recording .rec-inner {
      border-radius: 8px;
      transform: scale(0.6);
    }
    .share-btn {
      display: none;
      background: #00e676;
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,230,118,0.4);
    }
    .share-btn.visible { display: block; }
  </style>
</head>
<body>
  <div class="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="720" height="1280"></canvas>

    <div class="rec-indicator" id="recIndicator">
      <div class="dot"></div>
      <span id="recTimer">00:00</span>
    </div>

    <div class="controls">
      <button class="share-btn" id="shareBtn">Save / Share Video</button>
      <div class="hint" id="hint">Tap screen to spin • Tap red button to record</div>
      <div class="btn-row">
        <button class="rec-btn" id="recBtn" aria-label="Record video">
          <div class="rec-inner"></div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const recBtn = document.getElementById('recBtn');
    const recIndicator = document.getElementById('recIndicator');
    const recTimer = document.getElementById('recTimer');
    const shareBtn = document.getElementById('shareBtn');

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let currentLetter = "?";
    let spinning = false;
    let isWinner = false;
    let badgeScale = 1;

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let timerInterval = null;
    let lastRecordedFile = null;

    // 1. Start Camera (with microphone for reactions, fallback to video-only)
    async function initCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 1280 } },
          audio: true
        });
      } catch (e) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
          });
        } catch (err) {
          alert("Please allow camera access to use the filter.");
          return;
        }
      }
      video.srcObject = mediaStream;
      await video.play();
      requestAnimationFrame(drawFrame);
    }

    // 2. Draw Camera + Letter Overlay onto Canvas (so both get recorded)
    function drawFrame() {
      const cw = canvas.width;
      const ch = canvas.height;

      if (video.readyState >= 2) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const videoAspect = vw / vh;
        const canvasAspect = cw / ch;

        let sx, sy, sw, sh;
        if (videoAspect > canvasAspect) {
          sh = vh;
          sw = vh * canvasAspect;
          sx = (vw - sw) / 2;
          sy = 0;
        } else {
          sw = vw;
          sh = vw / canvasAspect;
          sx = 0;
          sy = (vh - sh) / 2;
        }

        ctx.save();
        ctx.translate(cw, 0);
        ctx.scale(-1, 1); // Mirror selfie camera
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        ctx.restore();
      }

      // Smooth scale animation on winner
      const targetScale = isWinner ? 1.18 : 1.0;
      badgeScale += (targetScale - badgeScale) * 0.2;

      // Draw Letter Card at top center
      ctx.save();
      ctx.translate(cw / 2, ch * 0.19);
      ctx.scale(badgeScale, badgeScale);

      const boxW = 190;
      const boxH = 190;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = isWinner ? "#00e676" : "#ff0066";
      ctx.lineWidth = 8;

      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = 25;
      ctx.shadowOffsetY = 10;

      ctx.beginPath();
      ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 38);
      ctx.fill();
      ctx.stroke();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "#666666";
      ctx.font = "700 18px system-ui, -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("YOUR LETTER", 0, -42);

      ctx.fillStyle = "#111111";
      ctx.font = "900 96px system-ui, -apple-system, sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(currentLetter, 0, 18);
      ctx.restore();

      requestAnimationFrame(drawFrame);
    }

    // 3. Spin Letters when tapping the video canvas
    canvas.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      isWinner = false;

      const interval = setInterval(() => {
        currentLetter = letters[Math.floor(Math.random() * letters.length)];
      }, 60);

      setTimeout(() => {
        clearInterval(interval);
        currentLetter = letters[Math.floor(Math.random() * letters.length)];
        isWinner = true;
        spinning = false;
      }, 2500);
    });

    // 4. Record Video + Audio
    recBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      shareBtn.classList.remove('visible');

      const canvasStream = canvas.captureStream(30);
      const combinedTracks = [...canvasStream.getVideoTracks()];
      if (mediaStream && mediaStream.getAudioTracks().length > 0) {
        combinedTracks.push(mediaStream.getAudioTracks()[0]);
      }
      const combinedStream = new MediaStream(combinedTracks);

      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm'
      ];
      const mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || '';

      mediaRecorder = new MediaRecorder(combinedStream, mimeType ? { mimeType } : {});
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const type = mediaRecorder.mimeType || 'video/webm';
        const ext = type.includes('mp4') ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type });
        lastRecordedFile = new File([blob], `letter-filter-${Date.now()}.${ext}`, { type });
        shareBtn.classList.add('visible');
      };

      mediaRecorder.start();
      isRecording = true;
      recBtn.classList.add('recording');
      recIndicator.classList.add('active');

      let seconds = 0;
      recTimer.textContent = "00:00";
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        recTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recBtn.classList.remove('recording');
      recIndicator.classList.remove('active');
      clearInterval(timerInterval);
    }

    // 5. Save or Share directly to Phone Camera Roll / Instagram
    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!lastRecordedFile) return;

      if (navigator.canShare && navigator.canShare({ files: [lastRecordedFile] })) {
        try {
          await navigator.share({
            files: [lastRecordedFile],
            title: 'Random Letter Filter'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // Fallback direct download for desktop/browsers without file sharing
      const url = URL.createObjectURL(lastRecordedFile);
      const a = document.createElement('a');
      a.href = url;
      a.download = lastRecordedFile.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    initCamera();
  </script>
</body>
</html>
