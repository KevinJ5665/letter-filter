<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Random Letter Filter</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100dvh;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* Strict 9:16 container so the browser never double-crops the camera */
    .stage {
      position: relative;
      aspect-ratio: 9 / 16;
      height: min(100dvh, calc(100vw * 16 / 9));
      max-width: 100vw;
      max-height: 100dvh;
      background: #111;
      overflow: hidden;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }
    .rec-indicator {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }
    .rec-indicator.active { display: flex; }
    .dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0.2; } }

    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 10;
    }
    .action-row {
      display: none;
      gap: 10px;
      pointer-events: auto; /* Fixes unclickable save buttons */
    }
    .action-row.visible {
      display: flex;
    }
    .action-btn {
      border: none;
      padding: 11px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }
    .share-btn {
      background: #00e676;
      color: #000;
    }
    .download-btn {
      background: #ffffff;
      color: #111;
    }
    .hint {
      color: #fff;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .rec-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: transparent;
      padding: 5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.15s ease;
    }
    .rec-btn:active { transform: scale(0.92); }
    .rec-inner {
      width: 100%;
      height: 100%;
      background: #ff2b4e;
      border-radius: 50%;
      transition: all 0.2s ease;
    }
    .rec-btn.recording .rec-inner {
      border-radius: 8px;
      transform: scale(0.58);
    }
  </style>
</head>
<body>
  <div class="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" width="720" height="1280"></canvas>

    <div class="rec-indicator" id="recIndicator">
      <div class="dot"></div>
      <span id="recTimer">00:00</span>
    </div>

    <div class="controls">
      <div class="action-row" id="actionRow">
        <button class="action-btn share-btn" id="shareBtn">Share / Save</button>
        <button class="action-btn download-btn" id="downloadBtn">Download File</button>
      </div>
      <div class="hint" id="hint">Tap screen to spin • Tap red button to record</div>
      <div class="btn-row">
        <button class="rec-btn" id="recBtn" aria-label="Record video">
          <div class="rec-inner"></div>
        </button>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const recBtn = document.getElementById('recBtn');
    const recIndicator = document.getElementById('recIndicator');
    const recTimer = document.getElementById('recTimer');
    const actionRow = document.getElementById('actionRow');
    const shareBtn = document.getElementById('shareBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let currentLetter = "?";
    let spinning = false;
    let isWinner = false;
    let badgeScale = 1;

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let timerInterval = null;
    let lastRecordedFile = null;
    let lastRecordedUrl = null;

    // 1. Start Camera using native wide sensor without forced portrait crop
    async function initCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });
      } catch (e) {
        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
          });
        } catch (err) {
          alert("Please allow camera access to use the filter.");
          return;
        }
      }
      video.srcObject = mediaStream;
      await video.play();
      requestAnimationFrame(drawFrame);
    }

    // 2. Render 9:16 Canvas Frame + Badge Overlay
    function drawFrame() {
      const cw = canvas.width;
      const ch = canvas.height;

      if (video.readyState >= 2 && video.videoWidth > 0) {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const videoAspect = vw / vh;
        const canvasAspect = cw / ch;

        let sx = 0, sy = 0, sw = vw, sh = vh;
        if (videoAspect > canvasAspect) {
          sw = vh * canvasAspect;
          sx = (vw - sw) / 2;
        } else {
          sh = vw / canvasAspect;
          sy = (vh - sh) / 2;
        }

        ctx.save();
        ctx.translate(cw, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cw, ch);
        ctx.restore();
      }

      const targetScale = isWinner ? 1.15 : 1.0;
      badgeScale += (targetScale - badgeScale) * 0.2;

      ctx.save();
      ctx.translate(cw / 2, ch * 0.16);
      ctx.scale(badgeScale, badgeScale);

      const boxW = 165;
      const boxH = 165;
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = isWinner ? "#00e676" : "#ff0066";
      ctx.lineWidth = 7;

      ctx.shadowColor = "rgba(0,0,0,0.35)";
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 8;

      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 32);
      } else {
        ctx.rect(-boxW / 2, -boxH / 2, boxW, boxH);
      }
      ctx.fill();
      ctx.stroke();

      ctx.shadowColor = "transparent";
      ctx.fillStyle = "#666666";
      ctx.font = "700 15px system-ui, -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("YOUR LETTER", 0, -36);

      ctx.fillStyle = "#111111";
      ctx.font = "900 84px system-ui, -apple-system, sans-serif";
      ctx.textBaseline = "middle";
      ctx.fillText(currentLetter, 0, 16);
      ctx.restore();

      requestAnimationFrame(drawFrame);
    }

    // 3. Spin Letters on Canvas Tap
    canvas.addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      isWinner = false;

      const interval = setInterval(() => {
        currentLetter = letters[Math.floor(Math.random() * letters.length)];
      }, 60);

      setTimeout(() => {
        clearInterval(interval);
        currentLetter = letters[Math.floor(Math.random() * letters.length)];
        isWinner = true;
        spinning = false;
      }, 2500);
    });

    // 4. Record Video + Audio
    recBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    });

    function startRecording() {
      recordedChunks = [];
      actionRow.classList.remove('visible');
      if (lastRecordedUrl) URL.revokeObjectURL(lastRecordedUrl);

      const canvasStream = canvas.captureStream(30);
      const combinedTracks = [...canvasStream.getVideoTracks()];
      if (mediaStream && mediaStream.getAudioTracks().length > 0) {
        combinedTracks.push(mediaStream.getAudioTracks()[0]);
      }
      const combinedStream = new MediaStream(combinedTracks);

      const mimeTypes = [
        'video/mp4',
        'video/webm;codecs=vp9,opus',
        'video/webm'
      ];
      const supportedType = mimeTypes.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';

      mediaRecorder = new MediaRecorder(combinedStream, supportedType ? { mimeType: supportedType } : {});
      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const rawMime = mediaRecorder.mimeType || 'video/webm';
        // Strip codec parameters so iOS/Android Share API accepts the file
        const cleanMime = rawMime.split(';')[0] || 'video/webm';
        const ext = cleanMime.includes('mp4') ? 'mp4' : 'webm';

        const blob = new Blob(recordedChunks, { type: cleanMime });
        lastRecordedFile = new File([blob], `letter-filter-${Date.now()}.${ext}`, { type: cleanMime });
        lastRecordedUrl = URL.createObjectURL(blob);
        actionRow.classList.add('visible');
      };

      // Pass 200ms timeslice so mobile browsers flush video chunks reliably
      mediaRecorder.start(200);
      isRecording = true;
      recBtn.classList.add('recording');
      recIndicator.classList.add('active');

      let seconds = 0;
      recTimer.textContent = "00:00";
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        recTimer.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      isRecording = false;
      recBtn.classList.remove('recording');
      recIndicator.classList.remove('active');
      clearInterval(timerInterval);
    }

    function triggerDownload() {
      if (!lastRecordedUrl || !lastRecordedFile) return;
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = lastRecordedUrl;
      a.download = lastRecordedFile.name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => a.remove(), 200);
    }

    // 5A. Share / Save via native phone sheet
    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!lastRecordedFile) return;

      if (navigator.canShare && navigator.canShare({ files: [lastRecordedFile] })) {
        try {
          await navigator.share({
            files: [lastRecordedFile],
            title: 'Random Letter Filter'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      triggerDownload();
    });

    // 5B. Direct file download fallback
    downloadBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerDownload();
    });

    initCamera();
  </script>
</body>
</html>
